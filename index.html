<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy 25th Birthday ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #ffd6e7, transparent 40%),
                radial-gradient(circle at bottom right, #ffb6c9, transparent 40%),
                linear-gradient(135deg, #ffdde8, #fff0f5);

            position: relative;
        }

        /* Background glow */
        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: #ff4f81;
            filter: blur(180px);
            opacity: 0.18;
            animation: glow 5s infinite alternate;
        }

        @keyframes glow {
            from {
                transform: scale(0.8);
            }

            to {
                transform: scale(1.2);
            }
        }

        /* Birthday Card */
        .birthday-card {
            position: relative;
            z-index: 10;

            width: min(90%, 600px);
            padding: 55px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.8);

            border-radius: 30px;

            box-shadow:
                0 20px 50px rgba(180, 40, 80, 0.2),
                inset 0 0 30px rgba(255, 255, 255, 0.5);

            animation:
                cardEntrance 1.5s ease forwards,
                floating 4s ease-in-out infinite 1.5s;
        }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(80px);
            }

            70% {
                transform: scale(1.05) translateY(-10px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Small heading */
        .title {
            font-size: 18px;
            letter-spacing: 4px;
            text-transform: uppercase;

            color: #c2185b;

            margin-bottom: 25px;

            animation: fadeIn 2s ease;
        }

        /* Main wish */
        .wish {
            font-size: clamp(24px, 5vw, 38px);
            font-weight: 700;

            line-height: 1.6;

            color: #333;

            animation: fadeIn 2s ease 0.5s backwards;
        }

        /* Sweet */
        .sweet {
            color: #e91e63;

            display: inline-block;

            animation:
                textGlow 2s infinite alternate,
                bounce 2s ease-in-out infinite;
        }

        /* Heat */
        .heat {
            color: #ef744f;

            display: inline-block;

            animation:
                flame 1.2s infinite alternate;
        }

        /* Clickable birthday text */
        .heartbeat {
            display: inline-block;

            color: #d81b60;

            font-size: 1.1em;

            text-decoration: none;

            cursor: pointer;

            animation: heartbeat 1s infinite;

            transition:
                color 0.3s ease,
                transform 0.3s ease,
                text-shadow 0.3s ease;
        }

        .heartbeat:hover {
            text-shadow:
                0 0 10px rgba(216, 27, 96, 0.5),
                0 0 20px rgba(216, 27, 96, 0.3);

            transform: scale(1.05);
        }

        .heart {
            display: inline-block;

            animation: heartBeat 1s infinite;
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.25);
            }

            40% {
                transform: scale(1);
            }

            60% {
                transform: scale(1.2);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        @keyframes textGlow {
            from {
                text-shadow: 0 0 5px rgba(233, 30, 99, 0.2);
            }

            to {
                text-shadow: 0 0 20px rgba(233, 30, 99, 0.6);
            }
        }

        @keyframes flame {
            0% {
                transform: translateY(0) rotate(-2deg);

                text-shadow:
                    0 0 5px #ff5722;
            }

            100% {
                transform: translateY(-5px) rotate(2deg);

                text-shadow:
                    0 0 10px #e2dbd9,
                    0 0 20px #ffffff;
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Floating hearts */
        .floating-heart {
            position: absolute;

            bottom: -50px;

            font-size: 25px;

            opacity: 0;

            animation: floatUp linear infinite;
        }

        .h1 {
            left: 10%;
            animation-duration: 7s;
        }

        .h2 {
            left: 25%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .h3 {
            left: 45%;
            animation-duration: 6s;
            animation-delay: 1s;
        }

        .h4 {
            left: 65%;
            animation-duration: 8s;
            animation-delay: 3s;
        }

        .h5 {
            left: 85%;
            animation-duration: 7s;
            animation-delay: 1.5s;
        }

        @keyframes floatUp {
            0% {
                transform:
                    translateY(0)
                    scale(0.5)
                    rotate(0deg);

                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            50% {
                transform:
                    translateY(-50vh)
                    scale(1)
                    rotate(20deg);
            }

            100% {
                transform:
                    translateY(-110vh)
                    scale(1.4)
                    rotate(-20deg);

                opacity: 0;
            }
        }


        /* Extra floating hearts & chocolates */
        .bg-treat {
            position: absolute;
            z-index: 1;
            bottom: -90px;
            pointer-events: none;
            user-select: none;
            opacity: 0;
            animation: treatFloat linear infinite;
        }

        .bg-heart {
            font-size: clamp(28px, 4vw, 58px);
        }

        .bg-chocolate {
            font-size: clamp(26px, 3.5vw, 52px);
        }

        .b1 { left: 3%;  animation-duration: 10s; animation-delay: -1s; }
        .b2 { left: 12%; animation-duration: 13s; animation-delay: -7s; }
        .b3 { left: 22%; animation-duration: 9s;  animation-delay: -4s; }
        .b4 { left: 34%; animation-duration: 15s; animation-delay: -11s; }
        .b5 { left: 47%; animation-duration: 11s; animation-delay: -3s; }
        .b6 { left: 59%; animation-duration: 14s; animation-delay: -9s; }
        .b7 { left: 71%; animation-duration: 10s; animation-delay: -6s; }
        .b8 { left: 82%; animation-duration: 13s; animation-delay: -2s; }
        .b9 { left: 92%; animation-duration: 9s;  animation-delay: -8s; }

        .c1 { left: 8%;  animation-duration: 12s; animation-delay: -5s; }
        .c2 { left: 28%; animation-duration: 16s; animation-delay: -12s; }
        .c3 { left: 52%; animation-duration: 13s; animation-delay: -7s; }
        .c4 { left: 76%; animation-duration: 15s; animation-delay: -10s; }
        .c5 { left: 95%; animation-duration: 11s; animation-delay: -3s; }

        @keyframes treatFloat {
            0% {
                transform: translateY(20vh) translateX(0) rotate(-12deg) scale(0.65);
                opacity: 0;
            }
            10% {
                opacity: 0.75;
            }
            35% {
                transform: translateY(-25vh) translateX(25px) rotate(12deg) scale(0.9);
            }
            65% {
                transform: translateY(-65vh) translateX(-25px) rotate(-10deg) scale(1.05);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-125vh) translateX(30px) rotate(15deg) scale(1.2);
                opacity: 0;
            }
        }

        .bg-treat:nth-of-type(3n) {
            animation-name: treatFloat, treatPulse;
            animation-duration: 12s, 2.2s;
            animation-iteration-count: infinite, infinite;
        }

        @keyframes treatPulse {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(255, 80, 130, 0.1)); }
            50% { filter: drop-shadow(0 0 12px rgba(255, 80, 130, 0.45)); }
        }

        /* Sparkles */
        .sparkle {
            position: absolute;

            font-size: 20px;

            animation:
                sparkle 2s infinite ease-in-out;
        }

        .s1 {
            top: 15%;
            left: 15%;
        }

        .s2 {
            top: 20%;
            right: 15%;
            animation-delay: 0.7s;
        }

        .s3 {
            bottom: 15%;
            left: 20%;
            animation-delay: 1.2s;
        }

        .s4 {
            bottom: 20%;
            right: 20%;
            animation-delay: 1.7s;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0.2;
                transform:
                    scale(0.6)
                    rotate(0);
            }

            50% {
                opacity: 1;
                transform:
                    scale(1.3)
                    rotate(180deg);
            }
        }


        /* Big animated background hearts */
        .bg-heart {
            position: absolute;
            z-index: 1;
            font-size: clamp(70px, 12vw, 150px);
            opacity: 0.13;
            pointer-events: none;
            animation: bigHeartFloat 8s ease-in-out infinite;
        }

        .bg-heart.bh1 { top: 5%; left: 3%; animation-duration: 9s; }
        .bg-heart.bh2 { top: 18%; right: 4%; animation-duration: 11s; animation-delay: 1s; }
        .bg-heart.bh3 { bottom: 4%; left: 5%; animation-duration: 10s; animation-delay: 2s; }
        .bg-heart.bh4 { bottom: 10%; right: 5%; animation-duration: 8s; animation-delay: 0.5s; }
        .bg-heart.bh5 { top: 45%; left: 1%; animation-duration: 12s; animation-delay: 3s; }
        .bg-heart.bh6 { top: 42%; right: 1%; animation-duration: 10s; animation-delay: 1.5s; }
        .bg-heart.bh7 { top: 2%; left: 45%; animation-duration: 13s; animation-delay: 2.5s; }
        .bg-heart.bh8 { bottom: 1%; left: 43%; animation-duration: 9s; animation-delay: 4s; }

        @keyframes bigHeartFloat {
            0%, 100% {
                transform: translateY(0) scale(1) rotate(-5deg);
                opacity: 0.09;
            }
            50% {
                transform: translateY(-18px) scale(1.12) rotate(5deg);
                opacity: 0.18;
            }
        }

        /* Mobile - responsive only */
        @media (max-width: 600px) {
            html,
            body {
                width: 100%;
                min-height: 100%;
            }

            body {
                min-height: 100dvh;
                padding: 16px;
            }

            .birthday-card {
                width: 100%;
                max-width: 600px;
                padding: 40px 20px;
            }

            .title {
                font-size: 14px;
                letter-spacing: 3px;
            }

            .wish {
                font-size: clamp(20px, 6vw, 25px);
                line-height: 1.5;
            }

            .heartbeat {
                font-size: 1em;
            }

            body::before {
                width: 70vw;
                height: 70vw;
                filter: blur(100px);
            }

            .sparkle {
                font-size: 16px;
            }

            .floating-heart {
                font-size: 20px;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 10px;
            }

            .birthday-card {
                padding: 30px 12px;
                border-radius: 24px;
            }

            .wish {
                font-size: 20px;
            }

            .title {
                font-size: 12px;
                letter-spacing: 2px;
                margin-bottom: 18px;
            }
        }

    </style>
</head>

<body>

    <!-- Extra hearts & chocolates -->
    <div class="bg-treat bg-heart b1">❤️</div>
    <div class="bg-treat bg-heart b2">💗</div>
    <div class="bg-treat bg-heart b3">💕</div>
    <div class="bg-treat bg-heart b4">💖</div>
    <div class="bg-treat bg-heart b5">💘</div>
    <div class="bg-treat bg-heart b6">💝</div>
    <div class="bg-treat bg-heart b7">💓</div>
    <div class="bg-treat bg-heart b8">❤️</div>
    <div class="bg-treat bg-heart b9">💗</div>

    <div class="bg-treat bg-chocolate c1">🍫</div>
    <div class="bg-treat bg-chocolate c2">🍫</div>
    <div class="bg-treat bg-chocolate c3">🍫</div>
    <div class="bg-treat bg-chocolate c4">🍫</div>
    <div class="bg-treat bg-chocolate c5">🍫</div>


    <!-- Big animated background hearts -->
    <div class="bg-heart bh1">❤️</div>
    <div class="bg-heart bh2">💗</div>
    <div class="bg-heart bh3">💕</div>
    <div class="bg-heart bh4">💖</div>
    <div class="bg-heart bh5">❤️</div>
    <div class="bg-heart bh6">💘</div>
    <div class="bg-heart bh7">💗</div>
    <div class="bg-heart bh8">💕</div>

    <!-- Floating hearts -->
    <div class="floating-heart h1">❤️</div>
    <div class="floating-heart h2">💗</div>
    <div class="floating-heart h3">💕</div>
    <div class="floating-heart h4">💖</div>
    <div class="floating-heart h5">💘</div>

    <!-- Sparkles -->
    <div class="sparkle s1">✨</div>
    <div class="sparkle s2">✨</div>
    <div class="sparkle s3">💫</div>
    <div class="sparkle s4">✨</div>

    <!-- Main Card -->
    <div class="birthday-card">

        <!-- <div class="title">
             
        </div> -->

        <div class="wish">

            <span class="sweet">
                Dil ka hai sweet 🌹
            </span>

            <br>

            <span class="heat">
                Style tera heat 🔥
            </span>

            <br>

            Happy 25th birthday,

            <!-- CLICKABLE TEXT -->
            <a href="#" class="heartbeat" id="birthdayToggle">
                my heartbeat
                <span class="heart">💗</span>
            </a>

        </div>

    </div>

    <script>

        const birthdayToggle =
            document.getElementById("birthdayToggle");

        let isTreat = false;

        birthdayToggle.addEventListener("click", function(event) {

            event.preventDefault();

            isTreat = !isTreat;

            if (isTreat) {

                birthdayToggle.innerHTML =
                    `my favourite treat 🍫😉`;

            } else {

                birthdayToggle.innerHTML =
                    `my heartbeat <span class="heart">💗</span>`;

            }

        });

    </script>

</body>
</html>
